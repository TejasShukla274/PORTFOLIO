<html>
<head>
    <title>GTA</title>
    <link rel="stylesheet" href="first.css">
    <link rel="stylesheet" href="games.css">
    <link rel="stylesheet" href="drop.css">
</head>

<body>

    <!-- Hidden checkbox used to open and close the Games curtain -->
    <input type="checkbox" id="games-toggle">


    <!-- =========================
         HEADER
         ========================= -->

    <div class="head">

        <!-- Rockstar Logo -->
        <div class="rock">
            <img class="rockk" src="Photos/logo.png">
        </div>


        <!-- Navigation Buttons -->
        <div class="buttons">

            <!-- GAMES BUTTON -->
            <label for="games-toggle" class="B1">
                GAMES
            </label>

            <button class="B2">NEWSWIRE</button>

            <button class="B3">VIDEOS</button>

            <button class="B4">DOWNLOADS</button>


            <!-- STORE -->
            <a class="store"
               href="https://support.rockstargames.com/">

                <button class="B5">STORE</button>

            </a>


            <!-- SUPPORT -->
            <a class="support"
               href="https://support.rockstargames.com/">

                <button class="B6">SUPPORT</button>

            </a>

        </div>


        <!-- Right side of header -->
        <div class="C">

            <!-- Get Launcher -->
            <a href="https://socialclub.rockstargames.com/rockstar-games-launcher">

                <div class="but2">

                    <button class="launch">
                        Get Launcher
                    </button>

                </div>

            </a>


            <!-- Search -->
            <div class="C1">

                <button class="search">

                    <img class="sear"
                         src="Photos/search.png"
                         alt="Search">

                </button>

            </div>


            <!-- Profile -->
            <div class="C2">

                <button class="profile">

                    <img class="prof"
                         src="Photos/profile.png"
                         alt="Profile">

                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         GAMES CURTAIN
         ========================= -->

    <div class="games-curtain">


        <div class="content">


            <!-- Heading -->
            <div class="heading">

                <p>Featured Games</p>


                <div class="arr">

                    <button class="view">

                        View All

                        <img class="arrow"
                             src="Photos/arrow.png"
                             alt="Arrow">

                    </button>

                </div>

            </div>



            <!-- Game Cards -->
            <div class="tab">

                <img class="A"
                     src="Photos/GTA6.webp">

                <img class="A"
                     src="Photos/GTA5.webp">

                <img class="A"
                     src="Photos/Online.webp">

                <img class="A"
                     src="Photos/RDR.jpg">

                <img class="A"
                     src="Photos/RDR_1.jpg">

            </div>


        </div>


    </div>
 <div class="logo">

            <img class="Gta" src="Photos/GTA_6Logo.png" alt="">
            <div class="text">
                <p class="Top">GRAND THEFT AUTO VI</p>
                <p class="bot">An Extended Look: Now Playing </p>
          <div class="but">
               <a href="https://www.rockstargames.com/VI/an-extended-look">
                <button class="Watch">Watch Now</button>
               </a>

               <a href="https://www.rockstargames.com/VI">


                   <button class="Order">Pre-Order Now</button>

               </a>
              
          </div>      
          
            </div>
        </div>

</body>
</html>
